# Single source of truth for SpinDynamica release metadata displayed on the website.
# To announce a new GitHub Release:
#   1. Create and publish the versioned release on GitHub.
#   2. Set `published: true` and update `version`, `tag`, `release_date`,
#      and (optionally) `asset_name` and `notes_summary`.
#   3. Move the previous release entry into `previous_releases`.

published: false
version: ""
tag: ""
release_date: ""
asset_name: ""
min_mathematica: "8.0"
tested_mathematica: "14.1"
notes_summary: ""

previous_releases: []
# Example once prior releases exist:
# previous_releases:
#   - version: "3.10.0"
#     tag: "v3.10.0"
#     release_date: "YYYY-MM-DD"
#     notes: "Initial GitHub release."
