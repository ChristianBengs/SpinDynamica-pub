<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="site-title">{{ site.title }}</span>
    </a>

    <button
      type="button"
      class="nav-toggle"
      aria-expanded="false"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation menu"
    >
      Menu
    </button>

    <nav id="primary-navigation" class="site-nav" aria-label="Primary navigation">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
          {% assign is_active = false %}
          {% if page.section and page.section == item.section %}
            {% assign is_active = true %}
          {% elsif page.url == item.url %}
            {% assign is_active = true %}
          {% endif %}
          <li class="nav-item">
            <a
              class="nav-link{% if is_active %} active{% endif %}"
              href="{{ item.url | relative_url }}"
              {% if is_active %}aria-current="page"{% endif %}
            >{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var nav = document.getElementById('primary-navigation');
    if (!toggle || !nav) return;
    document.documentElement.classList.add('has-nav-js');
    toggle.addEventListener('click', function () {
      var expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      nav.classList.toggle('is-open', !expanded);
    });
  })();
</script>
